<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Login | PetCare</title>
<style>body{margin:0;font-family:Arial;background:#fff2eb;display:flex;align-items:center;justify-content:center;min-height:100vh}.box{width:360px;background:#fff;padding:35px;border-radius:18px;box-shadow:0 10px 35px #0001}h1{text-align:center;color:#ff6b35}input,button{width:100%;padding:12px;margin:8px 0 16px;box-sizing:border-box}button{background:#ff6b35;color:#fff;border:0;border-radius:25px}a{color:#ff6b35}</style>
</head>
<body>
    <div class="box">
        <h1>🐾 Login</h1>
        <form>
            <label>Email</label>
            <input type="email" required>
            <label>Password</label>
            <input type="password" required>
            <button type="submit">Login</button>
        </form><p>Don't have an account? <a href="register.html">Register</a></p>
    </div>
</body>
</html>
